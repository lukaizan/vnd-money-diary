<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>VND 가계부</title>

  <!-- PWA / iOS 홈 화면 설정 -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#2f6fed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VND가계부" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="./css/style.css" />

  <!-- 요약 화면의 차트에 쓰는 Chart.js (npm/빌드 없이 CDN으로 불러옴).
       defer로 불러와서 화면 렌더링을 막지 않고, app.js보다 먼저 실행되도록 함.
       CDN 로딩에 실패해도(오프라인 등) 앱의 나머지 기능은 정상 동작합니다. -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1>VND 가계부</h1>
      <p id="rate-indicator" class="rate-indicator">환율 확인 중...</p>
    </header>

    <main id="screen-root" aria-live="polite"></main>

    <nav id="bottom-nav" class="bottom-nav">
      <button type="button" data-screen="calendar" class="nav-btn">
        <span class="nav-icon">▦</span>
        <span class="nav-label">캘린더</span>
      </button>
      <button type="button" data-screen="input" class="nav-btn">
        <span class="nav-icon">＋</span>
        <span class="nav-label">입력</span>
      </button>
      <button type="button" data-screen="list" class="nav-btn">
        <span class="nav-icon">≡</span>
        <span class="nav-label">목록</span>
      </button>
      <button type="button" data-screen="summary" class="nav-btn">
        <span class="nav-icon">Σ</span>
        <span class="nav-label">요약</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
